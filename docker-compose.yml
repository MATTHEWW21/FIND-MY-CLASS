services:
  backend:
    build: ./backend
    container_name: naviu_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - /app/node_modules
    # Todas las variables (base de datos, JWT, etc.) salen del archivo .env de la raiz del proyecto
    env_file:
      - .env
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres:15-alpine
    container_name: naviu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Solo accesible desde tu computadora (no desde la red)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: