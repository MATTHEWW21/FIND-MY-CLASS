<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Preferencias</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="welcome-container scrollable">
    <!-- Título Principal -->
    <header class="header-text center-align margin-top-10">
        <h1 class="preferences-title">Preferencias</h1>
    </header>

    <section class="preferences-form">
        <!-- Sección Rutas Accesibles (todos los perfiles) -->
        <div class="accessibility-section">
            <span class="section-title-pill">¿Necesitas rutas accesibles?</span>

            <!-- Tarjeta Naranja Informativa -->
            <div class="info-card">
                Evita escaleras y rutas adaptadas para silla de ruedas
            </div>

            <!-- Botones Sí / No (Sin selección por defecto) -->
            <div class="toggle-buttons">
                <button type="button" class="btn-option" id="btn-accessible-yes">Si, la necesito</button>
                <button type="button" class="btn-option" id="btn-accessible-no">No, gracias</button>
            </div>
        </div>

        <!-- ESTUDIANTE: las opciones las carga preferences.js desde la base de datos -->
        <div class="dropdown-group" id="student-fields">
            <div class="custom-select-container">
                <div class="select-field" id="select-building-trigger">
                    <span class="select-label">• Edificio Habitual</span>
                    <span class="select-arrow">▼</span>
                </div>
                <select id="select-building" class="hidden-select">
                    <option value="" disabled selected>Selecciona una opción</option>
                </select>
            </div>

            <div class="custom-select-container">
                <div class="select-field" id="select-career-trigger">
                    <span class="select-label">• ¿Que estudias?</span>
                    <span class="select-arrow">▼</span>
                </div>
                <select id="select-career" class="hidden-select">
                    <option value="" disabled selected>Selecciona tu carrera</option>
                </select>
            </div>
        </div>

        <!-- COLABORADOR UAG (oculto para estudiantes) -->
        <div class="dropdown-group" id="worker-fields" style="display: none;">
            <div class="custom-select-container">
                <div class="select-field" id="select-space-trigger">
                    <span class="select-label">• Selecciona tu espacio principal de trabajo</span>
                    <span class="select-arrow">▼</span>
                </div>
                <select id="select-space" class="hidden-select">
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="sala_maestro">Sala de maestro</option>
                    <option value="cubiculo_oficina">Cubículo/Oficina</option>
                    <option value="no_aplica">No aplica</option>
                </select>
            </div>

            <!-- Solo aparece si el espacio no es "No aplica"; sus opciones dependen del espacio elegido -->
            <div class="custom-select-container" id="stay-group" style="display: none;">
                <div class="select-field" id="select-stay-trigger">
                    <span class="select-label">• Seleccione su estancia</span>
                    <span class="select-arrow">▼</span>
                </div>
                <select id="select-stay" class="hidden-select">
                    <option value="" disabled selected>Selecciona una opción</option>
                </select>
            </div>

            <div class="custom-select-container">
                <div class="select-field" id="select-view-trigger">
                    <span class="select-label">• Detalle de la interfaz de usuario</span>
                    <span class="select-arrow">▼</span>
                </div>
                <select id="select-view" class="hidden-select">
                    <option value="" disabled selected>Selecciona una opción</option>
                    <option value="simplificada">Vista Simplificada (Sin feed, sin publicaciones)</option>
                    <option value="completa">Vista Completa (Incluye todo)</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Botón de Continuar -->
    <footer class="footer-action margin-top-auto">
        <button type="button" id="btn-save" class="btn-primary-submit">Guardar y Continuar</button>
    </footer>
</main>

<script src="js/api.js"></script>
<script src="js/preferences.js"></script>
</body>
</html>
