<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Mapa</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/mapa.css">
</head>
<body>

<main class="map-screen-container">

    <!-- Encabezado -->
    <header class="map-header">
        <h1>FIND MY CLASS</h1>
    </header>

    <!-- Buscador Flotante -->
    <div class="map-search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a87948" stroke-width="2">
            <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <input type="text" id="map-search-input" placeholder="BUSCA AQUÍ" />
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a87948" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
    </div>

    <!-- Chips de Filtros -->
    <div class="filter-chips">
        <button class="chip" onclick="filterPOIs('snack')">🍿 MÁQUINAS DE SNACKS</button>
        <button class="chip" onclick="filterPOIs('tienda')">🏪 TIENDAS DE CONVENIENCIA</button>
        <button class="chip" onclick="filterPOIs('bebedero')">🚰 BEBEDEROS</button>
        <button class="chip" onclick="filterPOIs('tecobus')">🚌 TECOBUS</button>
    </div>

    <!-- Área del Mapa Leaflet -->
    <div id="map"></div>

    <!-- Tarjeta Inferior de Esquema General -->
    <div class="static-map-card">
        <h3>MAPA GENERAL DEL CAMPUS</h3>
        <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&q=80&w=300" alt="Plano general">
    </div>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>INICIO</span>
        </a>
        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
            <span>REGISTRO</span>
        </a>
        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span>MENSAJES</span>
        </a>
        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>PERFIL</span>
        </a>
    </nav>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/mapa.js"></script>
</body>
</html>
