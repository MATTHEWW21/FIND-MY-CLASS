<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Feed</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/feed.css">
</head>
<body class="feed-body">

<div class="mobile-app-wrapper">

    <!-- Header Principal -->
    <header class="app-header">
        <h1 class="brand-title">FIND MY CLASS</h1>
    </header>

    <!-- Sub-header de Navegación Rápida -->
    <div class="top-actions">
        <!-- Botón MAPAS -->
        <a href="mapa.html" class="action-btn active" id="btn-mapas" style="text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-10a8 8 0 0 1 16 0Z"/>
                <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>MAPAS</span>
        </a>

        <!-- Botón PUBLICACIÓN -->
        <a href="nueva-publicacion.html" class="action-btn" id="btn-publicacion" style="text-decoration: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span>PUBLICACIÓN</span>
        </a>
    </div>

    <!-- Contenido Principal: Feed de Publicaciones -->
    <main class="feed-container">

        <!-- CONTENEDOR DINÁMICO PARA PUBLICACIÓN NUEVA -->
        <div id="new-post-container"></div>

        <h3 class="feed-section-title" style="margin: 12px 14px 6px 14px; font-size: 0.9rem; font-weight: 800; color: #333;">Feed de la Comunidad</h3>

        <!-- Publicación Existente 1 -->
        <article class="post-card">
            <div class="post-header">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&q=80&w=120" alt="Matias Fernández" class="user-avatar">
                <div class="user-info">
                    <h3 class="user-name">Matias Fernández</h3>
                    <span class="post-time">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline-icon"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
                        Hoy, 3:45 PM
                    </span>
                </div>
            </div>

            <h2 class="activity-title">Bicicleta en la tarde</h2>

            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">Distancia</span>
                    <span class="metric-value">400 m</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Calorías</span>
                    <span class="metric-value">30</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Tiempo</span>
                    <span class="metric-value">7 min</span>
                </div>
            </div>

            <div class="post-gallery">
                <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&q=80&w=300" alt="Mapa" class="gallery-img">
                <img src="https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&q=80&w=300" alt="Campus UAG" class="gallery-img">
                <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&q=80&w=300" alt="Entrada" class="gallery-img">
            </div>

            <div class="post-social">
                <div class="likes-avatars">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=60" alt="User" class="mini-avatar">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=60" alt="User" class="mini-avatar">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=60" alt="User" class="mini-avatar">
                </div>
                <span class="likes-text">Le gusta a ti y a 5 otros</span>
            </div>

            <div class="post-actions">
                <div class="action-buttons-left">
                    <button type="button" class="icon-btn heart-btn active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    </button>
                    <button type="button" class="icon-btn comment-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                </div>
                <button type="button" class="icon-btn more-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </button>
            </div>
        </article>

    </main>

    <!-- Barra de Navegación Inferior (Bottom Nav) -->
    <nav class="bottom-nav">
        <a href="feed.html" id="nav-inicio" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>INICIO</span>
        </a>
        <a href="registro.html" class="nav-item" id="nav-iniciar-ruta">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2">
                <path d="M5 3l14 9-14 9V3z"/>
            </svg>
            <span>INICIAR RUTA</span>
        </a>
        <a href="#" id="nav-mensajes" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span>MENSAJES</span>
        </a>
        <a href="#" id="nav-perfil" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>PERFIL</span>
        </a>
    </nav>

    <!-- Overlay del Tutorial -->
    <div id="tutorial-overlay" class="tutorial-overlay">
        <button type="button" id="btn-skip-tutorial" class="tutorial-skip-btn">Omitir</button>
        <div id="tutorial-card" class="tutorial-card">
            <p id="tutorial-text" class="tutorial-text">Toca la pantalla para iniciar el tutorial</p>
        </div>
    </div>

</div>

<!-- Carga de Scripts -->
<script src="js/feed.js"></script>
<script src="js/tutorial.js"></script>
</body>
</html>
