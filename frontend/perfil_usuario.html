<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAGPS - Perfil de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/contraste.css">
</head>
<body>

<main class="registro-container">

    <!-- Encabezado Fijo Superior con Menú de Opciones -->
    <header class="registro-header">
        <h1>UAGPS</h1>
        <div class="header-subrow">
            <button type="button" class="perfil-volver" id="perfil-volver">← Volver</button>
            <div class="profile-handle" id="perfil-handle"></div>
            <!-- Botón de Menú de Opciones (Líneas Naranja) -->
            <button type="button" class="profile-menu-btn" id="profile-menu-btn" aria-label="Opciones de perfil">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Menú Desplegable Flotante -->
        <div class="profile-dropdown-menu hidden" id="profile-dropdown-menu">
            <button type="button" class="dropdown-item danger hidden" id="opt-quitar">Quitar amigo</button>
            <button type="button" class="dropdown-item" id="opt-reportar">Reportar</button>
            <button type="button" class="dropdown-item" id="opt-bloquear">Bloquear</button>
        </div>
    </header>

    <!-- Banner Superior Ilustrativo -->
    <div class="profile-banner">
        <div class="profile-avatar-large" id="perfil-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </div>

    <!-- Banner Informativo de Estado de Bloqueo (Oculto por defecto) -->
    <div class="blocked-banner hidden" id="blocked-banner">
        ⚠️ Has bloqueado a este usuario
    </div>

    <!-- Sección de Información y Estadísticas -->
    <div class="profile-info-section" id="profile-info-section">
        <h2 class="profile-real-name" id="perfil-nombre">Cargando…</h2>
        <p class="perfil-rol" id="perfil-rol"></p>

        <!-- Métricas de Seguidores -->
        <div class="profile-stats-grid">
            <div class="stat-box">
                <span class="stat-number" id="stat-amigos">–</span>
                <span class="stat-label">Amigos</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="stat-pubs">–</span>
                <span class="stat-label">Publicaciones</span>
            </div>
        </div>

        <!-- Botón Agrega Amigos -->
        <button type="button" class="btn-add-friend hidden" id="btn-add-friend">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Agrega amigos</span>
        </button>
    </div>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>INICIO</span>
        </a>
        <a href="registro.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
            <span>INICIAR RUTA</span>
        </a>
        <a href="mensajes.html" id="nav-mensajes" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span>MENSAJES</span>
        </a>
        <!-- En la barra inferior (bottom-nav) -->
        <a href="mi_perfil.html" id="nav-perfil" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>PERFIL</span>
        </a>
    </nav>

</main>

<script src="js/aviso.js"></script>
<script src="js/api.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
