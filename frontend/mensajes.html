<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAGPS - Mensajes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/mensajes.css">
    <link rel="stylesheet" href="css/mensajes_extra.css">
    <link rel="stylesheet" href="css/role-ui.css">
    <script src="js/aviso.js"></script>
<script src="js/role-ui.js"></script>
    <link rel="stylesheet" href="css/contraste.css">
</head>
<body>

<main class="registro-container">

    <!-- Header Principal -->
    <header class="registro-header">
        <h1>UAGPS</h1>
    </header>

    <!-- Sub-header de Mensajes con Buscador -->
    <div class="chat-subheader">
        <div class="chat-title-row">
            <a class="chat-back-arrow" href="feed.html" id="chat-back" aria-label="Volver">←</a>
            <h2>MENSAJES</h2>
            <button type="button" class="add-contact-btn" id="btn-amigos" title="Añadir contacto">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                <span class="badge-solicitudes hidden" id="badge-solicitudes">0</span>
            </button>
        </div>

        <!-- Buscador -->
        <div class="search-bar-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="Buscar amigos..." class="search-input" id="buscar-amigos" autocomplete="off">
        </div>

        <!-- Carrusel de amigos (se llena con mensajes.js) -->
        <div class="stories-carousel" id="carrusel">
            <div class="story-item" id="nuevo-chat">
                <div class="story-circle new-chat">+</div>
                <span class="story-name">Nuevo chat</span>
            </div>
        </div>
    </div>

    <!-- Encabezado del Chat Activo -->
    <div class="active-chat-header hidden" id="chat-header">
        <div class="chat-user-info">
            <div class="avatar-iniciales" id="chat-avatar"></div>
            <h3 class="active-chat-name" id="chat-nombre"></h3>
        </div>
    </div>

    <!-- Área de Mensajes de Conversación -->
    <div class="chat-messages-area" id="chat-messages">
        <p class="chat-vacio" id="chat-vacio">Elige un amigo para empezar a chatear.</p>
    </div>

    <!-- Input para enviar mensajes -->
    <div class="chat-input-bar hidden" id="chat-input-bar">
        <button type="button" class="attach-btn" id="btn-adjuntar" title="Enviar una foto">📎</button>
        <input type="file" id="input-foto" accept="image/jpeg,image/png,image/webp" hidden>
        <div class="foto-previa hidden" id="foto-previa">
            <img id="foto-previa-img" alt="Foto por enviar">
            <button type="button" id="foto-quitar" aria-label="Quitar foto">✕</button>
        </div>
        <input type="text" id="chat-input-field" placeholder="Escribe un mensaje..." class="chat-input" maxlength="1000" autocomplete="off">
        <button type="button" class="send-btn" id="btn-send-msg" aria-label="Enviar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m2 21 21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
    </div>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>INICIO</span>
        </a>
        <a href="registro.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
            <span>INICIAR RUTA</span>
        </a>
        <a href="mensajes.html" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span>MENSAJES</span>
        </a>
        <a href="mi_perfil.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>PERFIL</span>
        </a>
    </nav>

</main>

<!-- Amigos: buscar personas y responder solicitudes -->
<div class="amigos-fondo hidden" id="amigos-fondo">
    <div class="amigos-hoja" role="dialog" aria-label="Amigos">
        <div class="amigos-cabecera">
            <h2>Amigos</h2>
            <button type="button" class="amigos-cerrar" id="amigos-cerrar" aria-label="Cerrar">✕</button>
        </div>

        <input type="text" class="amigos-buscar" id="amigos-buscar" placeholder="Busca a una persona por nombre..." autocomplete="off" maxlength="40">
        <div id="amigos-resultados" class="amigos-lista"></div>

        <h3 class="amigos-titulo" id="titulo-recibidas">Solicitudes recibidas</h3>
        <div id="amigos-recibidas" class="amigos-lista"></div>

        <h3 class="amigos-titulo" id="titulo-enviadas">Solicitudes enviadas</h3>
        <div id="amigos-enviadas" class="amigos-lista"></div>

        <h3 class="amigos-titulo" id="titulo-mis-amigos">Mis amigos</h3>
        <div id="amigos-mis" class="amigos-lista"></div>

        <p class="amigos-mensaje" id="amigos-mensaje" role="status"></p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/mensajes.js"></script>
<script src="js/a11y-comun.js"></script>
</body>
</html>
