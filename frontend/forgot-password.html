<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<main class="welcome-container scrollable">
    <header class="header-text left-align">
        <h1 class="form-title">Recupera tu contraseña</h1>
        <p class="form-subtitle">Ingresa tu correo institucional para redefinir tu clave de acceso.</p>
    </header>

    <form id="form-forgot" class="form-container">
        <!-- Correo Institucional -->
        <div class="input-icon-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="forgot-email" placeholder="Correo institucional" required class="pill-input-icon">
        </div>

        <!-- Nueva Contraseña -->
        <div class="input-icon-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="pass-main" placeholder="Nueva Contraseña" required class="pill-input-icon">
        </div>

        <!-- Reglas de validación -->
        <div class="rules-box">
            <p>Tu contraseña debe contener:</p>
            <ul>
                <li id="rule-min" class="rule-invalid">Mínimo 8 caracteres</li>
                <li id="rule-upper" class="rule-invalid">Una letra mayúscula</li>
                <li id="rule-num" class="rule-invalid">Al menos un número</li>
                <li id="rule-spec" class="rule-invalid">Al menos un carácter especial</li>
            </ul>
        </div>

        <!-- Confirma Nueva Contraseña -->
        <div class="input-icon-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="pass-confirm" placeholder="Confirma Nueva Contraseña" required class="pill-input-icon">
        </div>

        <button type="submit" class="btn-primary margin-top-20">Guardar Contraseña</button>
    </form>

    <footer class="footer-action">
        <a href="login.html" class="link-back">Volver a Iniciar Sesión</a>
    </footer>
</main>

<script src="js/forgot-password.js"></script>
<script>
    lucide.createIcons();
</script>
</body>
</html>
