<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Verificación de datos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="welcome-container">
    <header class="header-text center-align margin-top-20">
        <h1 class="verify-title">Verificación<br>de datos</h1>
    </header>

    <div class="verify-content">
        <p class="verify-text">Ingresa el código que enviamos a tu correo institucional</p>

        <form id="form-verify" class="form-container margin-top-20">
            <input type="text" id="verify-code" placeholder="Ingresa el codigo" maxlength="6" required class="pill-input text-center">

            <button type="submit" class="btn-primary margin-top-auto">Regresar para iniciar sesión</button>
        </form>
    </div>
</main>

<script src="js/verify.js"></script>
</body>
</html>
