<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAGPS - Verificación de datos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/contraste.css">
    <script src="js/ui-grande.js"></script>
</head>
<body>

<main class="welcome-container">
    <header class="header-text center-align margin-top-20">
        <h1 class="verify-title">Verificación<br>de datos</h1>
    </header>

    <div class="verify-content">
        <p class="verify-text">Ingresa el código que enviamos a tu correo institucional</p>

        <form id="form-verify" class="form-container margin-top-20">
            <input type="text" id="verify-code" placeholder="Ingresa el codigo" aria-label="Código de verificación" maxlength="6" inputmode="numeric" required class="pill-input text-center">
            <input type="password" id="verify-password" placeholder="Tu contraseña" aria-label="Tu contraseña, la que usaste al registrarte" aria-describedby="verify-ayuda" autocomplete="current-password" required class="pill-input text-center">
            <small id="verify-ayuda" class="verify-text">Escribe también la contraseña que elegiste al registrarte. Así nadie más puede verificar tu cuenta.</small>

            <a href="#" id="btn-resend" class="link-back">Reenviar código</a>

            <button type="submit" class="btn-primary margin-top-auto">Regresar para iniciar sesión</button>
        </form>
    </div>
</main>

<script src="js/aviso.js"></script>
<script src="js/api.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
