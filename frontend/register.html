<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Class - Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="welcome-container scrollable">
  <header class="header-text left-align">
    <h1 class="form-title">Ingresa tus datos</h1>
  </header>

  <form id="form-register" class="form-container">
    <!-- Campos de Datos Personales -->
    <input type="text" id="reg-nombre" placeholder="Nombre(s)" required class="pill-input">
    <input type="text" id="reg-apellido" placeholder="Apellido(s)" required class="pill-input">
    <input type="text" id="reg-registro" placeholder="Número de Registro" required class="pill-input">
    <input type="email" id="reg-correo" placeholder="Correo institucional" required class="pill-input">

    <!-- Campo de Contraseña -->
    <input type="password" id="pass-main" placeholder="Contraseña" required class="pill-input">

    <!-- Reglas de validación -->
    <div class="rules-box">
      <p>Tu contraseña debe contener:</p>
      <ul>
        <li id="rule-min" class="rule-invalid">Mínimo 8 caracteres</li>
        <li id="rule-upper" class="rule-invalid">Una letra mayúscula</li>
        <li id="rule-num" class="rule-invalid">Al menos un número</li>
        <li id="rule-spec" class="rule-invalid">Al menos un carácter especial</li>
      </ul>
    </div>

    <!-- Confirmación de Contraseña -->
    <input type="password" id="pass-confirm" placeholder="Confirma Contraseña" required class="pill-input">

    <button type="submit" id="btn-submit" class="btn-primary margin-top-20">Continuar</button>
  </form>

  <footer class="footer-action">
    <a href="login.html" class="link-back">Volver a Iniciar Sesión</a>
  </footer>
</main>

<script src="js/registro.js"></script>
</body>
</html>
