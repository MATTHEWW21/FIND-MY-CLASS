<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Nueva Publicación</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/publicacion.css">
</head>
<body>

<main class="mobile-container">

    <!-- Header Find My Class -->
    <header class="app-title-header">
        <h1>FIND MY CLASS</h1>
    </header>

    <!-- Sub-header de Publicación -->
    <div class="sub-header">
        <button class="btn-icon close-btn" id="btn-close" aria-label="Cerrar">✕</button>
        <span class="sub-header-title">NUEVA PUBLICACIÓN</span>
        <button class="btn-text next-btn" id="btn-next">NEXT</button>
    </div>

    <!-- Preview Principal de la Foto con Overlay -->
    <section class="media-preview-container">
        <!-- Imagen principal del campus/recorrido -->
        <img src="assets/uag-campus.jpg" alt="Recorrido Campus UAG" class="main-preview-img">

        <!-- Trazo Blanco de la Ruta Superpuesto -->
        <svg class="route-overlay-svg" viewBox="0 0 200 120" preserveAspectRatio="none">
            <path d="M 30,90 Q 70,30 110,65 T 180,20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        </svg>

        <!-- Badge Flotante de Actividad (Tap para abrir selector) -->
        <button class="activity-badge-btn" id="open-activity-modal" title="Cambiar Actividad">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2.5"/>
                <path d="m9 20 3-6 3 6"/>
                <path d="m6 9 6 1 6-1"/>
                <path d="M12 10v4"/>
            </svg>
        </button>

        <!-- Banner Inferior de Métricas de la Foto -->
        <div class="preview-metrics-banner">
            <div class="activity-name-tag" id="display-activity-name">CAMINATA</div>
            <div class="metrics-row">
                <div class="m-col">
                    <span class="m-val" id="display-dist">2.00 KM</span>
                    <span class="m-lbl">DISTANCIA</span>
                </div>
                <div class="m-col">
                    <span class="m-val" id="display-dur">00:22:35</span>
                    <span class="m-lbl">DURACIÓN</span>
                </div>
                <div class="m-col">
                    <span class="m-val" id="display-cal">125</span>
                    <span class="m-lbl">CALORÍAS</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Galería de Selección de Fotos (2x4) -->
    <section class="gallery-grid">
        <div class="gallery-item active"><img src="assets/uag-campus.jpg" alt="Foto 1"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 2"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 3"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 4"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 5"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 6"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 7"></div>
        <div class="gallery-item"><img src="assets/campus-2.jpg" alt="Foto 8"></div>
    </section>

    <!-- Navegación Inferior -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>INICIO</span>
        </a>
        <a href="registro.html" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
            <span>REGISTRO</span>
        </a>
        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span>MENSAJES</span>
        </a>
        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>PERFIL</span>
        </a>
    </nav>

    <!-- Modal Desplegable: Seleccionar Actividad (Pantalla 2) -->
    <div class="modal-overlay hidden" id="activity-modal">
        <div class="activity-popover">
            <div class="popover-arrow"></div>
            <h3 class="popover-title">SELECCIONAR ACTIVIDAD</h3>

            <ul class="activity-options-list">
                <li class="option-item selected" data-act="caminata">
                    <span class="opt-icon bg-orange">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="12" cy="5" r="2.5"/><path d="m9 20 3-6 3 6"/><path d="m6 9 6 1 6-1"/></svg>
                    </span>
                    <span class="opt-text">Caminata</span>
                </li>
                <li class="option-item" data-act="carrera">
                    <span class="opt-icon bg-blue">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="15" cy="4" r="2"/><path d="M7 21l3-4 2 1 3 4"/><path d="M11 13l-2-2 3-3 4 2 3-2"/></svg>
                    </span>
                    <span class="opt-text">Carrera</span>
                </li>
                <li class="option-item" data-act="ciclismo">
                    <span class="opt-icon bg-green">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M12 17.5V14l-3-4 4-3.5 3 3"/></svg>
                    </span>
                    <span class="opt-text">Ciclismo</span>
                </li>
                <li class="option-item" data-act="inclusivo">
                    <span class="opt-icon bg-purple">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="12" cy="4" r="2"/><path d="M12 6v7"/><circle cx="12" cy="17" r="4"/></svg>
                    </span>
                    <span class="opt-text">Recorrido Inclusivo</span>
                </li>
                <li class="option-item" data-act="scooter">
                    <span class="opt-icon bg-grey">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 18h12M16 6h2v12"/></svg>
                    </span>
                    <span class="opt-text">Scooter</span>
                </li>
            </ul>

            <button class="btn-accept" id="btn-accept-activity">Aceptar</button>
        </div>
    </div>

</main>

<script src="js/publicacion.js"></script>
</body>
</html>
