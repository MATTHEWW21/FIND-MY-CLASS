<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Bienvenida</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="welcome-container">
    <!-- Logo Principal -->
    <div class="logo-container">
        <!-- Si no tienes logo todavía, el texto o icono temporal sirve -->
        <img src="assets/logo.png" alt="Find My Class Logo" class="logo-img" onerror="this.style.display='none'">
    </div>

    <!-- Encabezados -->
    <header class="header-text">
        <h1>Bienvenido a<br><span>FIND MY CLASS</span></h1>
        <p class="subtitle">BUSCA - CAMINA - ENCUENTRA</p>
        <p class="question">¿Qué eres?</p>
    </header>

    <!-- Opciones de Rol -->
    <section class="role-selection">
        <button class="role-btn " data-role="estudiante">ESTUDIANTE</button>
        <button class="role-btn" data-role="colaborador">COLABORADOR UAG</button>
        <button class="role-btn" data-role="visitante">VISITANTE</button>
    </section>

    <!-- Botón de Acción -->
    <footer class="footer-action">
        <button class="btn-primary" id="btn-continuar">Continuar</button>
    </footer>
</main>

<script src="js/app.js"></script>
</body>
</html>
