<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAGPS - Bienvenida</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/contraste.css">
    <!-- Si ya hay sesion, se muestra "Cargando" en vez de la pantalla de elegir perfil mientras se revisa -->
    <script>
        try { if (localStorage.getItem('token') && localStorage.getItem('userRole') !== 'visitante') document.documentElement.classList.add('comprobando'); } catch (e) {}
    </script>
</head>
<body>

<main class="welcome-container loading-layout" id="cargando-sesion" role="status" aria-label="Cargando">
    <div class="loading-header">
        <div class="logo-container">
            <img src="assets/logo-naviU.png" alt="" class="loading-logo-img">
        </div>
        <header class="header-text center-align">
            <h1 class="loading-app-title">Bienvenido a<br>UAGPS</h1>
            <p class="loading-subtitle">BUSCA - CAMINA - ENCUENTRA</p>
        </header>
    </div>
    <div class="loading-center">
        <div class="spinner-circle" aria-hidden="true"></div>
        <p class="loading-text">Cargando<br>Interfaz</p>
    </div>
    <footer class="loading-footer">
        <img src="assets/uag-logo.jpg" alt="" class="uag-logo-img">
    </footer>
</main>

<main class="welcome-container" id="bienvenida">
    <!-- Logo Principal -->
    <div class="logo-container">
        <!-- Si no tienes logo todavía, el texto o icono temporal sirve -->
        <img src="assets/logo.png" alt="Find My Class Logo" class="logo-img" onerror="this.style.display='none'">
    </div>

    <!-- Encabezados -->
    <header class="header-text">
        <h1>Bienvenido a<br><span>UAGPS</span></h1>
        <p class="subtitle">BUSCA - CAMINA - ENCUENTRA</p>
        <p class="question">¿Qué eres?</p>
    </header>

    <!-- Opciones de Rol -->
    <section class="role-selection">
        <button class="role-btn " data-role="estudiante">ESTUDIANTE</button>
        <button class="role-btn" data-role="colaborador">COLABORADOR UAG</button>
        <button class="role-btn" data-role="visitante">VISITANTE</button>
    </section>

</main>

<script src="js/aviso.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
