<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Class - Cargando</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="welcome-container loading-layout">

    <!-- Sección Superior: Logo y Título -->
    <div class="loading-header">
        <div class="logo-container">
            <img src="assets/logo-naviU.png" alt="NaviU Logo" class="loading-logo-img">
        </div>

        <header class="header-text center-align">
            <h1 class="loading-app-title">Bienvenido a<br>FIND MY CLASS</h1>
            <p class="loading-subtitle">BUSCA - CAMINA - ENCUENTRA</p>
        </header>
    </div>

    <!-- Sección Central: Spinner y Texto -->
    <div class="loading-center">
        <div class="spinner-circle"></div>
        <p class="loading-text">Cargando<br>Interfaz</p>
    </div>

    <!-- Sección Inferior: Branding UAG -->
    <footer class="loading-footer">
        <img src="assets/uag-logo.jpg" alt="UAG Logo" class="uag-logo-img">
    </footer>

</main>

<script src="js/loading.js"></script>
</body>
</html>
