services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: naviu_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEV_MOSTRAR_CODIGO: "false"
    depends_on:
      - postgres_db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres_db:
    image: postgres:15-alpine
    container_name: naviu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
